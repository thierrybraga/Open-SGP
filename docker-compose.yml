services:
  api:
    build: .
    container_name: isp_erp_api
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/isp_erp
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5000}
      - AUTO_CREATE_TABLES=${AUTO_CREATE_TABLES:-false}
      - BOOTSTRAP_ADMIN_ENABLED=${BOOTSTRAP_ADMIN_ENABLED:-false}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-admin}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - PUBLIC_REGISTRATION_ENABLED=${PUBLIC_REGISTRATION_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  admin:
    build: .
    container_name: isp_erp_admin
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/isp_erp
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - AUTO_CREATE_TABLES=${AUTO_CREATE_TABLES:-false}
    command: ["python", "-m", "flask", "--app", "admin_panel.app", "run", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      - api
      - db
      - redis

  db:
    image: postgres:16
    container_name: isp_erp_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=isp_erp
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: isp_erp_redis
    ports:
      - "6379:6379"

  worker_comm:
    build: .
    container_name: isp_erp_worker_comm
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/isp_erp
      - REDIS_URL=redis://redis:6379/0
      - AUTO_CREATE_TABLES=${AUTO_CREATE_TABLES:-false}
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: ["python", "-m", "app.workers.communication_worker"]

volumes:
  pgdata:
